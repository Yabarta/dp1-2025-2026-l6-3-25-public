name: Sincronizar Manualmente

on:
  push:
    branches: [ main ]

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empujar al repositorio público
        run: |
          git config --global user.email "perezsornipablo@gmail.com"
          git config --global user.name "Yabarta"
          
          # Verificar que el PAT tiene acceso al repo público
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.API_TOKEN_GITHUB }}" https://api.github.com/repos/gii-is-DP1/dp1-2025-2026-l6-3-25-public)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: El token no tiene acceso al repositorio público (HTTP $STATUS). Comprueba el PAT y la autorización SSO si aplica."
            exit 1
          fi

          # Añadir remoto usando el token (usuario genérico) y empujar la rama actual a main
          git remote add publico https://x-access-token:${{ secrets.API_TOKEN_GITHUB }}@github.com/gii-is-DP1/dp1-2025-2026-l6-3-25-public.git
          git push publico HEAD:main --force
