name: Sincronizar Manualmente

on:
  push:
    branches: [ main ]

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empujar al repositorio público
        run: |
          git config --global user.email "perezsornipablo@gmail.com"
          git config --global user.name "Yabarta"
          
          git remote add publico https://Yabarta:${{ secrets.API_TOKEN_GITHUB }}@github.com/gii-is-DP1/dp1-2025-2026-l6-3-25-public.git
          
          git push publico main --force
