name: Sincronizar Manualmente

on:
  push:
    branches: [ main ]

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Depuración de Secreto (Verificar si existe)
        env:
          MY_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          if [ -z "$MY_TOKEN" ]; then
            echo "🔴 ERROR CRÍTICO: El secreto API_TOKEN_GITHUB está VACÍO o no se encuentra."
            echo "Asegúrate de que está en 'Repository Secrets' y no en 'Environment Secrets'."
            exit 1
          else
            echo "🟢 El secreto ha sido detectado correctamente (longitud: ${#MY_TOKEN} caracteres)."
          fi

      - name: Empujar al repositorio público
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          # Configuración de usuario
          git config --global user.email "perezsornipablo@gmail.com"
          git config --global user.name "Yabarta"
          
          # Creamos el archivo de credenciales manual para evitar el error del bot
          # Esto codifica tu usuario:token en base64 para la cabecera HTTP
          git config --global http.extraheader "Authorization: Basic $(echo -n Yabarta:${API_TOKEN_GITHUB} | base64)"
          
          # Añadimos el remoto SIN el token en la URL (ya va en la cabecera)
          git remote add publico https://github.com/gii-is-DP1/dp1-2025-2026-l6-3-25-public.git
          
          # Empujamos
          echo "Iniciando Push..."
          git push publico main --force